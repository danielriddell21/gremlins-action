name: 'Run gremlins unleash'
description: 'Official Version Action for Gremlins'
author: 'gremlins'
inputs:
  version: # change this
    required: false
    description: 'The version of Gremlins to use'
    default: 'latest'
  args:
    required: false
    description: 'The args to pass to the unleash command'
  workdir:
    required: false
    description: 'The working directory where Gremlins will find the Go module'
  token:
    required: false
    description: >-
      Token for the GitHub releases API, used only when version is "latest" or
      a range. An exact version makes no API call.
    default: ${{ github.token }}
  workers:
    required: false
    description: 'Mutants tested in parallel; empty leaves it to gremlins'
  memory-mb:
    required: false
    description: >-
      Address-space cap per process, in MiB, on Linux runners. Times workers,
      it has to fit in the runner's memory. 0 disables it.
    default: '0'
runs:
  using: 'node24'
  main: 'dist/index.js'
branding:
  color: blue
  icon: box